<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290" role="img" aria-label="KeyVault — Zero-knowledge secrets manager + in-memory env CLI">
  <title>KeyVault — Zero-knowledge secrets manager + in-memory env CLI</title>
  <defs>
    <pattern id="gk" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#d6ecff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="Gk" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#gk)"/>
      <path d="M60 0H0V60" fill="none" stroke="#d6ecff" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <radialGradient id="vk" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0c2a4d"/><stop offset="1" stop-color="#0a2341"/>
    </radialGradient>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa8cf"/>
    </marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d6ecff}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .dim{fill:#7fa8cf} .cy{fill:#5ad1ff} .am{fill:#ffb454}
    .ln{fill:none;stroke:#d6ecff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .lnd{fill:none;stroke:#7fa8cf;stroke-width:1;stroke-dasharray:3 4}
    .lnc{fill:none;stroke:#5ad1ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .draw{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 2.6s ease-out}
    .draw2{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 3.4s ease-out}
    @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .stamp{animation:stamp .7s cubic-bezier(.2,1.6,.4,1);transform:rotate(-14deg);transform-box:fill-box;transform-origin:center}
    @keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-14deg)}}
    .steam{animation:steam 3s ease-in-out infinite;transform-box:fill-box}
    .steam.b{animation-delay:1s} .steam.c{animation-delay:2s}
    @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
    .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="440" height="290" rx="14" fill="url(#vk)"/>
  <rect width="440" height="290" rx="14" fill="url(#Gk)"/>
  <rect x="8" y="8" width="424" height="274" rx="8" fill="none" stroke="#d6ecff" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="16" y="16" width="408" height="258" rx="4" fill="none" stroke="#d6ecff" stroke-opacity=".25" stroke-width="1"/>
  <path d="M152 8V16M152 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M288 8V16M288 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="84" y="14.5" font-size="6.5" text-anchor="middle" class="dim">1</text>
  <text x="220" y="14.5" font-size="6.5" text-anchor="middle" class="dim">2</text>
  <text x="356" y="14.5" font-size="6.5" text-anchor="middle" class="dim">3</text>
  <path d="M8 145H16M424 145H432" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="12" y="82" font-size="6.5" text-anchor="middle" class="dim">A</text>
  <text x="12" y="212" font-size="6.5" text-anchor="middle" class="dim">B</text>
  
  <text x="30" y="40" font-size="9" letter-spacing="2" class="dim">SHEET 03</text>
  <text x="410" y="40" font-size="9" letter-spacing="1" text-anchor="end" class="dim">VIEW REPO ↗</text>
  <text x="30" y="70" font-size="25" class="serif" font-weight="700">KeyVault</text>
  <text x="30" y="91" font-size="11.5" class="dim">Zero-knowledge secrets manager + in-memory env CLI</text>
  <path d="M30 101H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <g transform="translate(0 0)">
  <rect x="30" y="128" width="104" height="58" rx="6" class="ln"/>
  <text x="82" y="146" font-size="8.5" text-anchor="middle" class="dim">BROWSER / CLI</text>
  <text x="82" y="164" font-size="11" text-anchor="middle" class="am">DB_PASS=•••</text>
  <text x="82" y="179" font-size="8" text-anchor="middle" class="dim">PBKDF2 · 100k</text>
  <g transform="translate(162 132)">
    <path class="lnc" d="M10 22v-8a12 12 0 0 1 24 0v8"/><rect x="4" y="22" width="36" height="28" rx="4" class="lnc"/>
    <circle cx="22" cy="34" r="3.2" fill="#5ad1ff"/><path d="M22 37v6" stroke="#5ad1ff" stroke-width="2"/>
  </g>
  <text x="184" y="198" font-size="8.5" text-anchor="middle" class="cy">AES-256-GCM</text>
  <path class="lnd" d="M136 158H160M210 158H286"/>
  <circle r="3.4" fill="#ffb454"><animateMotion dur="3s" repeatCount="indefinite" path="M136 158H286"/></circle>
  <text x="248" y="150" font-size="9" text-anchor="middle" class="dim">9f3a…c1e0</text>
  <g transform="translate(296 124)">
    <ellipse cx="54" cy="10" rx="50" ry="10" class="ln"/><path class="ln" d="M4 10v52c0 6 22 10 50 10s50-4 50-10V10"/>
    <path class="ln" d="M4 30c0 6 22 10 50 10s50-4 50-10M4 48c0 6 22 10 50 10s50-4 50-10" stroke-opacity=".45"/>
  </g>
  <text x="350" y="214" font-size="8.5" text-anchor="middle" class="dim">server sees only</text>
  <text x="350" y="225" font-size="8.5" text-anchor="middle" class="dim">ciphertext + IV</text>
</g>
  <path d="M30 228H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <text x="30" y="246" font-size="10.5" style="fill:#5ad1ff">RBAC · versioned rollback · machine tokens · audit trail</text>
  <rect x="30" y="254" width="95" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="78" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Spring Boot</text><rect x="131.2" y="254" width="52" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="157" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">MySQL</text><rect x="189.2" y="254" width="38" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="208" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">JWT</text><rect x="232.79999999999998" y="254" width="88" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="277" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Web Crypto</text><rect x="326.79999999999995" y="254" width="74" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="364" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Node CLI</text>

</svg>
