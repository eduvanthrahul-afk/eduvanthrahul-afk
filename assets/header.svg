<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Rahul E. — Backend engineer, Java and Spring Boot">
  <title>Rahul E. — Backend engineer, Java and Spring Boot</title>
  <defs>
