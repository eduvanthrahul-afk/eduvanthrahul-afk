<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Revision history 2025 to 2026, plus 400+ LeetCode solved and a 1503 CodeChef rating">
  <title>Revision history 2025 to 2026, plus 400+ LeetCode solved and a 1503 CodeChef rating</title>
  <defs>
    <pattern id="gr" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#d6ecff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="Gr" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#gr)"/>
      <path d="M60 0H0V60" fill="none" stroke="#d6ecff" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <radialGradient id="vr" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0c2a4d"/><stop offset="1" stop-color="#0a2341"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa8cf"/>
    </marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d6ecff}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .dim{fill:#7fa8cf} .cy{fill:#5ad1ff} .am{fill:#ffb454}
    .ln{fill:none;stroke:#d6ecff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .lnd{fill:none;stroke:#7fa8cf;stroke-width:1;stroke-dasharray:3 4}
    .lnc{fill:none;stroke:#5ad1ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .draw{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 2.6s ease-out}
    .draw2{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 3.4s ease-out}
    @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .stamp{animation:stamp .7s cubic-bezier(.2,1.6,.4,1);transform:rotate(-14deg);transform-box:fill-box;transform-origin:center}
    @keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-14deg)}}
    .steam{animation:steam 3s ease-in-out infinite;transform-box:fill-box}
    .steam.b{animation-delay:1s} .steam.c{animation-delay:2s}
    @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
    .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="900" height="250" rx="14" fill="url(#vr)"/>
  <rect width="900" height="250" rx="14" fill="url(#Gr)"/>
  <rect x="8" y="8" width="884" height="234" rx="8" fill="none" stroke="#d6ecff" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="16" y="16" width="868" height="218" rx="4" fill="none" stroke="#d6ecff" stroke-opacity=".25" stroke-width="1"/>
  <path d="M161 8V16M161 234V242" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M305 8V16M305 234V242" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M450 8V16M450 234V242" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M595 8V16M595 234V242" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M739 8V16M739 234V242" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="88" y="14.5" font-size="6.5" text-anchor="middle" class="dim">1</text>
  <text x="233" y="14.5" font-size="6.5" text-anchor="middle" class="dim">2</text>
  <text x="378" y="14.5" font-size="6.5" text-anchor="middle" class="dim">3</text>
  <text x="522" y="14.5" font-size="6.5" text-anchor="middle" class="dim">4</text>
  <text x="667" y="14.5" font-size="6.5" text-anchor="middle" class="dim">5</text>
  <text x="812" y="14.5" font-size="6.5" text-anchor="middle" class="dim">6</text>
  <path d="M8 125H16M884 125H892" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="12" y="72" font-size="6.5" text-anchor="middle" class="dim">A</text>
  <text x="12" y="182" font-size="6.5" text-anchor="middle" class="dim">B</text>
  <text x="30" y="44" font-size="9" letter-spacing="2" class="dim">SHEET 09 · REVISION HISTORY</text>
  <path class="ln" d="M60 120H560" stroke-opacity=".5"/>
  <path d="M60 112V128" stroke="#5ad1ff" stroke-width="1.6"/><circle cx="60" cy="120" r="11" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.6"/><text x="60" y="124" font-size="11" text-anchor="middle" style="fill:#5ad1ff">A</text><text x="60" y="96" font-size="10" text-anchor="middle" class="dim">2025.09</text>
  <path d="M185 112V128" stroke="#5ad1ff" stroke-width="1.6"/><circle cx="185" cy="120" r="11" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.6"/><text x="185" y="124" font-size="11" text-anchor="middle" style="fill:#5ad1ff">B</text><text x="185" y="96" font-size="10" text-anchor="middle" class="dim">2026.02</text>
  <path d="M310 112V128" stroke="#5ad1ff" stroke-width="1.6"/><circle cx="310" cy="120" r="11" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.6"/><text x="310" y="124" font-size="11" text-anchor="middle" style="fill:#5ad1ff">C</text><text x="310" y="96" font-size="10" text-anchor="middle" class="dim">2026.09</text>
  <path d="M435 112V128" stroke="#5ad1ff" stroke-width="1.6"/><circle cx="435" cy="120" r="11" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.6"/><text x="435" y="124" font-size="11" text-anchor="middle" style="fill:#5ad1ff">D</text><text x="435" y="96" font-size="10" text-anchor="middle" class="dim">2026.10</text>
  <path d="M560 112V128" stroke="#5ad1ff" stroke-width="1.6"/><circle cx="560" cy="120" r="11" fill="#0c2a4d" stroke="#ffb454" stroke-width="1.6"/><text x="560" y="124" font-size="11" text-anchor="middle" style="fill:#ffb454">E</text><text x="560" y="96" font-size="10" text-anchor="middle" class="dim">2026.11</text>
  <text x="44" y="160" font-size="10.5"><tspan class="cy">REV A</tspan>  <tspan class="dim">2025.09</tspan>  Joined GitHub. First commits.</text>
  <text x="44" y="176" font-size="10.5"><tspan class="cy">REV B</tspan>  <tspan class="dim">2026.02</tspan>  KeyVault — learned crypto is a design decision.</text>
  <text x="44" y="192" font-size="10.5"><tspan class="cy">REV C</tspan>  <tspan class="dim">2026.09</tspan>  Verdant CRM · 380+ commit DSA log.</text>
  <text x="44" y="208" font-size="10.5"><tspan class="cy">REV D</tspan>  <tspan class="dim">2026.10</tspan>  Farm-E · DecisionTwin · OrbitConvert.</text>
  <text x="44" y="224" font-size="10.5"><tspan class="cy">REV E</tspan>  <tspan class="dim">2026.11</tspan>  Pomelo shipped. TwinGuard gate goes live.</text>
  
  <g transform="translate(600 62)">
    <rect width="270" height="156" fill="#0a2341" fill-opacity=".6" stroke="#d6ecff" stroke-opacity=".5"/>
    <text x="12" y="20" font-size="9" letter-spacing="2" class="cy">LOAD TESTS · PRACTICE</text>
    <path d="M0 30H270" stroke="#d6ecff" stroke-opacity=".3"/>
    <text x="12" y="62" font-size="30" class="serif" font-weight="700">400+</text>
    <text x="104" y="54" font-size="10">LeetCode</text><text x="104" y="67" font-size="9" class="dim">problems solved</text>
    <text x="12" y="104" font-size="30" class="serif" font-weight="700">1503</text>
    <text x="104" y="96" font-size="10">CodeChef</text><text x="104" y="109" font-size="9" class="dim">rating</text>
    <path d="M12 124H258" stroke="#d6ecff" stroke-opacity=".15"/>
    <text x="12" y="143" font-size="9.5" class="dim">result:</text>
    <g class="stamp"><rect x="66" y="128" width="104" height="22" rx="3" fill="none" stroke="#6be3a4" stroke-width="1.8"/>
    <text x="118" y="143" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle" style="fill:#6be3a4">APPROVED</text></g>
  </g>
</svg>
