  <text x="233" y="14.5" font-size="6.5" text-anchor="middle" class="dim">2</text>
  <text x="378" y="14.5" font-size="6.5" text-anchor="middle" class="dim">3</text>
  <text x="522" y="14.5" font-size="6.5" text-anchor="middle" class="dim">4</text>
  <text x="667" y="14.5" font-size="6.5" text-anchor="middle" class="dim">5</text>
  <text x="812" y="14.5" font-size="6.5" text-anchor="middle" class="dim">6</text>
  <path d="M8 120H16M884 120H892" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M8 224H16M884 224H892" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="12" y="70" font-size="6.5" text-anchor="middle" class="dim">A</text>
  <text x="12" y="174" font-size="6.5" text-anchor="middle" class="dim">B</text>
  <text x="12" y="278" font-size="6.5" text-anchor="middle" class="dim">C</text>
  <text x="30" y="44" font-size="9" letter-spacing="2" class="dim">SHEET 08 · BILL OF MATERIALS</text>
  <text x="870" y="44" font-size="9" text-anchor="end" class="dim">what every build above is made of</text>
  <rect x="30" y="56" width="840" height="260" fill="#0a2341" fill-opacity=".6" stroke="#d6ecff" stroke-opacity=".5"/>
  <path d="M30 82H870" stroke="#d6ecff" stroke-opacity=".5"/>
  <path d="M74 56V316M360 56V316M560 56V316" stroke="#d6ecff" stroke-opacity=".25"/>
  <text x="40" y="73" font-size="9.5" letter-spacing="2" class="cy">ITEM</text>
  <text x="84" y="73" font-size="9.5" letter-spacing="2" class="cy">PART</text>
  <text x="370" y="73" font-size="9.5" letter-spacing="2" class="cy">FUNCTION</text>
  <text x="570" y="73" font-size="9.5" letter-spacing="2" class="cy">SPEC / NOTE</text>
  <text x="40" y="99" font-size="11" class="dim">01</text><text x="84" y="99" font-size="12" style="fill:#d6ecff">Java 17</text><text x="370" y="99" font-size="11" class="dim">core language</text><text x="570" y="99" font-size="11">Oracle certified, SE 17</text>
  <path d="M30 108H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="125" font-size="11" class="dim">02</text><text x="84" y="125" font-size="12" style="fill:#d6ecff">Spring Boot 3 · Spring Security</text><text x="370" y="125" font-size="11" class="dim">services, auth</text><text x="570" y="125" font-size="11">JWT, refresh rotation, RBAC</text>
  <path d="M30 134H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="151" font-size="11" class="dim">03</text><text x="84" y="151" font-size="12" style="fill:#d6ecff">PostgreSQL · MySQL · MongoDB</text><text x="370" y="151" font-size="11" class="dim">storage</text><text x="570" y="151" font-size="11">Flyway migrations, transactions</text>
  <path d="M30 160H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="177" font-size="11" class="dim">04</text><text x="84" y="177" font-size="12" style="fill:#d6ecff">AES-256-GCM · PBKDF2</text><text x="370" y="177" font-size="11" class="dim">client-side crypto</text><text x="570" y="177" font-size="11">zero-knowledge by design</text>
  <path d="M30 186H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="203" font-size="11" class="dim">05</text><text x="84" y="203" font-size="12" style="fill:#d6ecff">JUnit · mutation testing</text><text x="370" y="203" font-size="11" class="dim">trust</text><text x="570" y="203" font-size="11">measure tests, don't assume them</text>
  <path d="M30 212H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="229" font-size="11" class="dim">06</text><text x="84" y="229" font-size="12" style="fill:#d6ecff">Docker · GitHub Actions</text><text x="370" y="229" font-size="11" class="dim">ship + gate</text><text x="570" y="229" font-size="11">exit codes a pipeline can read</text>
  <path d="M30 238H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="255" font-size="11" class="dim">07</text><text x="84" y="255" font-size="12" style="fill:#d6ecff">Python · Node.js</text><text x="370" y="255" font-size="11" class="dim">side engines</text><text x="570" y="255" font-size="11">simulation, CLI tooling</text>
  <path d="M30 264H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="281" font-size="11" class="dim">08</text><text x="84" y="281" font-size="12" style="fill:#d6ecff">React · vanilla JS</text><text x="370" y="281" font-size="11" class="dim">front panel</text><text x="570" y="281" font-size="11">just enough UI to prove the backend</text>
  <path d="M30 290H870" stroke="#d6ecff" stroke-opacity=".1"/>
  <text x="40" y="307" font-size="11" class="dim">09</text><text x="84" y="307" font-size="12" style="fill:#ffb454">Coffee</text><text x="370" y="307" font-size="11" class="dim">cooling system</text><text x="570" y="307" font-size="11">☕ continuous duty</text>
</svg>
