<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290" role="img" aria-label="Pomelo — Shipped Windows app: drag a file, tap a key, drop on a format">
  <title>Pomelo — Shipped Windows app: drag a file, tap a key, drop on a format</title>
  <defs>
    <pattern id="gp" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#d6ecff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="Gp" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#gp)"/>
      <path d="M60 0H0V60" fill="none" stroke="#d6ecff" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <radialGradient id="vp" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0c2a4d"/><stop offset="1" stop-color="#0a2341"/>
    </radialGradient>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa8cf"/>
    </marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d6ecff}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .dim{fill:#7fa8cf} .cy{fill:#5ad1ff} .am{fill:#ffb454}
    .ln{fill:none;stroke:#d6ecff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .lnd{fill:none;stroke:#7fa8cf;stroke-width:1;stroke-dasharray:3 4}
    .lnc{fill:none;stroke:#5ad1ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .draw{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 2.6s ease-out}
    .draw2{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 3.4s ease-out}
    @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .stamp{animation:stamp .7s cubic-bezier(.2,1.6,.4,1);transform:rotate(-14deg);transform-box:fill-box;transform-origin:center}
    @keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-14deg)}}
    .steam{animation:steam 3s ease-in-out infinite;transform-box:fill-box}
    .steam.b{animation-delay:1s} .steam.c{animation-delay:2s}
    @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
    .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="440" height="290" rx="14" fill="url(#vp)"/>
  <rect width="440" height="290" rx="14" fill="url(#Gp)"/>
  <rect x="8" y="8" width="424" height="274" rx="8" fill="none" stroke="#d6ecff" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="16" y="16" width="408" height="258" rx="4" fill="none" stroke="#d6ecff" stroke-opacity=".25" stroke-width="1"/>
  <path d="M152 8V16M152 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M288 8V16M288 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="84" y="14.5" font-size="6.5" text-anchor="middle" class="dim">1</text>
  <text x="220" y="14.5" font-size="6.5" text-anchor="middle" class="dim">2</text>
  <text x="356" y="14.5" font-size="6.5" text-anchor="middle" class="dim">3</text>
  <path d="M8 145H16M424 145H432" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="12" y="82" font-size="6.5" text-anchor="middle" class="dim">A</text>
  <text x="12" y="212" font-size="6.5" text-anchor="middle" class="dim">B</text>
  
  <text x="30" y="40" font-size="9" letter-spacing="2" class="dim">SHEET 07</text>
  <text x="410" y="40" font-size="9" letter-spacing="1" text-anchor="end" class="dim">VIEW REPO ↗</text>
  <text x="30" y="70" font-size="25" class="serif" font-weight="700">Pomelo</text>
  <text x="30" y="91" font-size="11.5" class="dim">Shipped Windows app: drag a file, tap a key, drop on a format</text>
  <path d="M30 101H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <g transform="translate(0 0)">
  <g class="spin" style="animation-duration:40s"><path d="M142.1 145.5L129.9 113.7A56 56 0 0 1 170.1 113.7L157.9 145.5A22 22 0 0 0 142.1 145.5z" fill="#5ad1ff" fill-opacity="0.08" stroke="#5ad1ff" stroke-opacity=".7"/><text x="150.0" y="130.0" font-size="8" text-anchor="middle" style="fill:#d6ecff">PNG</text><path d="M158.9 145.9L172.8 114.8A56 56 0 0 1 201.2 143.2L170.1 157.1A22 22 0 0 0 158.9 145.9z" fill="#5ad1ff" fill-opacity="0.08" stroke="#5ad1ff" stroke-opacity=".7"/><text x="177.6" y="141.4" font-size="8" text-anchor="middle" style="fill:#d6ecff">JPG</text><path d="M170.5 158.1L202.3 145.9A56 56 0 0 1 202.3 186.1L170.5 173.9A22 22 0 0 0 170.5 158.1z" fill="#ffb454" fill-opacity="0.35" stroke="#ffb454" stroke-opacity=".7"/><text x="189.0" y="169.0" font-size="8" text-anchor="middle" style="fill:#ffb454">PDF</text><path d="M170.1 174.9L201.2 188.8A56 56 0 0 1 172.8 217.2L158.9 186.1A22 22 0 0 0 170.1 174.9z" fill="#5ad1ff" fill-opacity="0.08" stroke="#5ad1ff" stroke-opacity=".7"/><text x="177.6" y="196.6" font-size="8" text-anchor="middle" style="fill:#d6ecff">MP4</text><path d="M157.9 186.5L170.1 218.3A56 56 0 0 1 129.9 218.3L142.1 186.5A22 22 0 0 0 157.9 186.5z" fill="#5ad1ff" fill-opacity="0.08" stroke="#5ad1ff" stroke-opacity=".7"/><text x="150.0" y="208.0" font-size="8" text-anchor="middle" style="fill:#d6ecff">WEBP</text><path d="M141.1 186.1L127.2 217.2A56 56 0 0 1 98.8 188.8L129.9 174.9A22 22 0 0 0 141.1 186.1z" fill="#5ad1ff" fill-opacity="0.08" stroke="#5ad1ff" stroke-opacity=".7"/><text x="122.4" y="196.6" font-size="8" text-anchor="middle" style="fill:#d6ecff">DOCX</text><path d="M129.5 173.9L97.7 186.1A56 56 0 0 1 97.7 145.9L129.5 158.1A22 22 0 0 0 129.5 173.9z" fill="#5ad1ff" fill-opacity="0.08" stroke="#5ad1ff" stroke-opacity=".7"/><text x="111.0" y="169.0" font-size="8" text-anchor="middle" style="fill:#d6ecff">MP3</text><path d="M129.9 157.1L98.8 143.2A56 56 0 0 1 127.2 114.8L141.1 145.9A22 22 0 0 0 129.9 157.1z" fill="#5ad1ff" fill-opacity="0.08" stroke="#5ad1ff" stroke-opacity=".7"/><text x="122.4" y="141.4" font-size="8" text-anchor="middle" style="fill:#d6ecff">GIF</text></g>
  <circle cx="150" cy="166" r="16" fill="#0c2a4d" stroke="#d6ecff" stroke-opacity=".5"/>
  <path d="M145 158h7l4 4v12h-11z" class="ln" stroke-width="1"/>
  <path d="M190 210l10 26 4-10 10-4z" fill="#d6ecff"/>
  <g font-size="10">
    <rect x="248" y="126" width="46" height="20" rx="4" class="ln"/><text x="271" y="140" text-anchor="middle">Shift</text><text x="304" y="140" class="dim">convert</text>
    <rect x="248" y="154" width="46" height="20" rx="4" class="ln"/><text x="271" y="168" text-anchor="middle">Ctrl</text><text x="304" y="168" class="dim">compress · trim</text>
    <rect x="248" y="182" width="46" height="20" rx="4" class="ln"/><text x="271" y="196" text-anchor="middle">Alt</text><text x="304" y="196" class="dim">share · move</text>
  </g>
  <text x="248" y="220" font-size="9" class="am">0 bytes uploaded. ever.</text>
</g>
  <path d="M30 228H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <text x="30" y="246" font-size="10.5" style="fill:#5ad1ff">released + live site · fully offline · tray app</text>
  <rect x="30" y="254" width="66" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="63" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Windows</text><rect x="102.4" y="254" width="45" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="125" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">.NET</text><rect x="153.2" y="254" width="59" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="183" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">FFmpeg</text><rect x="218.39999999999998" y="254" width="59" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="248" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Pandoc</text>

</svg>
