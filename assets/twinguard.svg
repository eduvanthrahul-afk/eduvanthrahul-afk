<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290" role="img" aria-label="TwinGuard — Safety gate for OTA car updates, with measured trust">
  <title>TwinGuard — Safety gate for OTA car updates, with measured trust</title>
  <defs>
    <pattern id="gt" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#d6ecff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="Gt" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#gt)"/>
      <path d="M60 0H0V60" fill="none" stroke="#d6ecff" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <radialGradient id="vt" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0c2a4d"/><stop offset="1" stop-color="#0a2341"/>
    </radialGradient>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa8cf"/>
    </marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d6ecff}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .dim{fill:#7fa8cf} .cy{fill:#5ad1ff} .am{fill:#ffb454}
    .ln{fill:none;stroke:#d6ecff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .lnd{fill:none;stroke:#7fa8cf;stroke-width:1;stroke-dasharray:3 4}
    .lnc{fill:none;stroke:#5ad1ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .draw{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 2.6s ease-out}
    .draw2{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 3.4s ease-out}
    @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .stamp{animation:stamp .7s cubic-bezier(.2,1.6,.4,1);transform:rotate(-14deg);transform-box:fill-box;transform-origin:center}
    @keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-14deg)}}
    .steam{animation:steam 3s ease-in-out infinite;transform-box:fill-box}
    .steam.b{animation-delay:1s} .steam.c{animation-delay:2s}
    @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
    .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="440" height="290" rx="14" fill="url(#vt)"/>
  <rect width="440" height="290" rx="14" fill="url(#Gt)"/>
  <rect x="8" y="8" width="424" height="274" rx="8" fill="none" stroke="#d6ecff" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="16" y="16" width="408" height="258" rx="4" fill="none" stroke="#d6ecff" stroke-opacity=".25" stroke-width="1"/>
  <path d="M152 8V16M152 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M288 8V16M288 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="84" y="14.5" font-size="6.5" text-anchor="middle" class="dim">1</text>
  <text x="220" y="14.5" font-size="6.5" text-anchor="middle" class="dim">2</text>
  <text x="356" y="14.5" font-size="6.5" text-anchor="middle" class="dim">3</text>
  <path d="M8 145H16M424 145H432" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="12" y="82" font-size="6.5" text-anchor="middle" class="dim">A</text>
  <text x="12" y="212" font-size="6.5" text-anchor="middle" class="dim">B</text>
  
  <text x="30" y="40" font-size="9" letter-spacing="2" class="dim">SHEET 02</text>
  <text x="410" y="40" font-size="9" letter-spacing="1" text-anchor="end" class="dim">VIEW REPO ↗</text>
  <text x="30" y="70" font-size="25" class="serif" font-weight="700">TwinGuard</text>
  <text x="30" y="91" font-size="11.5" class="dim">Safety gate for OTA car updates, with measured trust</text>
  <path d="M30 101H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <g transform="translate(0 0)">
  <text x="50" y="114" font-size="9" class="dim">speed ↑</text>
  <path class="ln" d="M44 214H300M44 116V214" stroke-opacity=".7"/>
  <path d="M264 112V214" stroke="#ff6b6b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="268" y="122" font-size="9" style="fill:#ff6b6b">obstacle</text>
  <path class="lnc draw" d="M46 130C120 130 150 132 180 160S232 208 250 212"/>
  <path class="draw2" d="M46 134C140 134 170 136 205 158S262 196 292 206" fill="none" stroke="#ffb454" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="120" y="126" font-size="9" class="cy">v1 approved — stops</text>
  <text x="168" y="192" font-size="9" class="am">v2 candidate</text>
  <text x="290" y="226" font-size="8" class="dim" text-anchor="end">distance →</text>
  <g class="stamp"><rect x="318" y="140" width="96" height="40" rx="4" fill="none" stroke="#ff6b6b" stroke-width="2.4"/>
  <rect x="322" y="144" width="88" height="32" rx="2" fill="none" stroke="#ff6b6b" stroke-width="1"/>
  <text x="366" y="166" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2" style="fill:#ff6b6b">BLOCKED</text></g>
  <text x="366" y="206" font-size="8.5" text-anchor="middle" class="dim">shadow-tested</text>
  <text x="366" y="217" font-size="8.5" text-anchor="middle" class="dim">across 104k runs</text>
</g>
  <path d="M30 228H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <text x="30" y="246" font-size="10.5" style="fill:#ffb454">203/314 real mutants caught · 0 false alarms in 104,000 scenarios</text>
  <rect x="30" y="254" width="66" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="63" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Java 17</text><rect x="102.4" y="254" width="95" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="150" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Spring Boot</text><rect x="203.60000000000002" y="254" width="52" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="230" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">React</text><rect x="261.6" y="254" width="38" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="280" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">FMI</text><rect x="305.20000000000005" y="254" width="52" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="331" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">CARLA</text>

</svg>
