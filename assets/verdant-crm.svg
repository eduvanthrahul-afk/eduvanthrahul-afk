<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290" role="img" aria-label="Verdant CRM — Lead → survey → quote → project → payment, in one system">
  <title>Verdant CRM — Lead → survey → quote → project → payment, in one system</title>
  <defs>
    <pattern id="gc" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#d6ecff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="Gc" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#gc)"/>
      <path d="M60 0H0V60" fill="none" stroke="#d6ecff" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <radialGradient id="vc" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0c2a4d"/><stop offset="1" stop-color="#0a2341"/>
    </radialGradient>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa8cf"/>
    </marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d6ecff}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .dim{fill:#7fa8cf} .cy{fill:#5ad1ff} .am{fill:#ffb454}
    .ln{fill:none;stroke:#d6ecff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .lnd{fill:none;stroke:#7fa8cf;stroke-width:1;stroke-dasharray:3 4}
    .lnc{fill:none;stroke:#5ad1ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .draw{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 2.6s ease-out}
    .draw2{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 3.4s ease-out}
    @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .stamp{animation:stamp .7s cubic-bezier(.2,1.6,.4,1);transform:rotate(-14deg);transform-box:fill-box;transform-origin:center}
    @keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-14deg)}}
    .steam{animation:steam 3s ease-in-out infinite;transform-box:fill-box}
    .steam.b{animation-delay:1s} .steam.c{animation-delay:2s}
    @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
    .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="440" height="290" rx="14" fill="url(#vc)"/>
  <rect width="440" height="290" rx="14" fill="url(#Gc)"/>
  <rect x="8" y="8" width="424" height="274" rx="8" fill="none" stroke="#d6ecff" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="16" y="16" width="408" height="258" rx="4" fill="none" stroke="#d6ecff" stroke-opacity=".25" stroke-width="1"/>
  <path d="M152 8V16M152 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <path d="M288 8V16M288 274V282" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="84" y="14.5" font-size="6.5" text-anchor="middle" class="dim">1</text>
  <text x="220" y="14.5" font-size="6.5" text-anchor="middle" class="dim">2</text>
  <text x="356" y="14.5" font-size="6.5" text-anchor="middle" class="dim">3</text>
  <path d="M8 145H16M424 145H432" stroke="#d6ecff" stroke-opacity=".4"/>
  <text x="12" y="82" font-size="6.5" text-anchor="middle" class="dim">A</text>
  <text x="12" y="212" font-size="6.5" text-anchor="middle" class="dim">B</text>
  
  <text x="30" y="40" font-size="9" letter-spacing="2" class="dim">SHEET 06</text>
  <text x="410" y="40" font-size="9" letter-spacing="1" text-anchor="end" class="dim">VIEW REPO ↗</text>
  <text x="30" y="70" font-size="25" class="serif" font-weight="700">Verdant CRM</text>
  <text x="30" y="91" font-size="11.5" class="dim">Lead → survey → quote → project → payment, in one system</text>
  <path d="M30 101H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <g transform="translate(0 0)"><path class="ln" d="M52 150H388" stroke-opacity=".5"/><circle cx="52" cy="150" r="13" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.5"/><text x="52" y="154" font-size="10" text-anchor="middle" class="cy">1</text><text x="52" y="180" font-size="9" text-anchor="middle" class="dim">Incoming</text><circle cx="136" cy="150" r="13" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.5"/><text x="136" y="154" font-size="10" text-anchor="middle" class="cy">2</text><text x="136" y="180" font-size="9" text-anchor="middle" class="dim">On-site</text><circle cx="220" cy="150" r="13" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.5"/><text x="220" y="154" font-size="10" text-anchor="middle" class="cy">3</text><text x="220" y="180" font-size="9" text-anchor="middle" class="dim">Quoted</text><circle cx="304" cy="150" r="13" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.5"/><text x="304" y="154" font-size="10" text-anchor="middle" class="cy">4</text><text x="304" y="180" font-size="9" text-anchor="middle" class="dim">In flight</text><circle cx="388" cy="150" r="13" fill="#0c2a4d" stroke="#5ad1ff" stroke-width="1.5"/><text x="388" y="154" font-size="10" text-anchor="middle" class="cy">5</text><text x="388" y="180" font-size="9" text-anchor="middle" class="dim">Collect</text>
  <circle r="5" fill="#ffb454"><animateMotion dur="6s" repeatCount="indefinite" keyTimes="0;.2;.25;.45;.5;.7;.75;.95;1" keyPoints="0;0;.25;.25;.5;.5;.75;.75;1" calcMode="linear" path="M52 136H388"/></circle>
  <rect x="122" y="196" width="196" height="22" rx="4" fill="#ff6b6b" fill-opacity=".1" stroke="#ff6b6b" stroke-opacity=".6"/>
  <text x="220" y="211" font-size="9.5" text-anchor="middle" style="fill:#ff6b6b">⚠ quote margin &lt; 15% → needs decision</text>
</g>
  <path d="M30 228H410" stroke="#d6ecff" stroke-opacity=".2"/>
  <text x="30" y="246" font-size="10.5" style="fill:#5ad1ff">revenue-at-risk dashboard · ⌘K omni-search · 360° customer view</text>
  <rect x="30" y="254" width="110" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="85" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Spring Boot 3</text><rect x="145.60000000000002" y="254" width="110" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="200" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">PostgreSQL 16</text><rect x="261.20000000000005" y="254" width="59" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="291" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Flyway</text><rect x="326.40000000000003" y="254" width="88" height="20" rx="10" fill="#5ad1ff" fill-opacity=".1" stroke="#5ad1ff" stroke-opacity=".55"/><text x="370" y="268" font-size="11" text-anchor="middle" fill="#5ad1ff" style="fill:#5ad1ff">Vanilla JS</text>

</svg>
